<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" font-family="'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <!-- 箭头标记：使用 orient="auto" 确保兼容性，markerUnits="userSpaceOnUse" 固定大小 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 z" fill="#495057"/>
    </marker>
    <!-- 节点阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="280" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="640" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#212529">PUBG Gun Control 使用流程</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#6c757d">从零到游戏内可用的完整流程</text>

  <!-- 步骤节点（6 个横向排列） -->
  <!-- 步骤 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="110" width="170" height="80" rx="10" ry="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="115" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#155724">步骤 1</text>
    <text x="115" y="162" text-anchor="middle" font-size="14" fill="#155724">初始化</text>
    <text x="115" y="180" text-anchor="middle" font-size="14" fill="#155724">ROI 区域</text>
  </g>
  <text x="115" y="215" text-anchor="middle" font-size="11" fill="#6c757d">F3 框选 5 个识别区域</text>

  <!-- 步骤 2 -->
  <g filter="url(#shadow)">
    <rect x="240" y="110" width="170" height="80" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="325" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0c5460">步骤 2</text>
    <text x="325" y="162" text-anchor="middle" font-size="14" fill="#0c5460">采集</text>
    <text x="325" y="180" text-anchor="middle" font-size="14" fill="#0c5460">枪械模板</text>
  </g>
  <text x="325" y="215" text-anchor="middle" font-size="11" fill="#6c757d">向导式截图采集</text>

  <!-- 步骤 3 -->
  <g filter="url(#shadow)">
    <rect x="450" y="110" width="170" height="80" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="535" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0c5460">步骤 3</text>
    <text x="535" y="162" text-anchor="middle" font-size="14" fill="#0c5460">导出</text>
    <text x="535" y="180" text-anchor="middle" font-size="14" fill="#0c5460">dofile 脚本</text>
  </g>
  <text x="535" y="215" text-anchor="middle" font-size="11" fill="#6c757d">--generate-lua 命令</text>

  <!-- 步骤 4 -->
  <g filter="url(#shadow)">
    <rect x="660" y="110" width="170" height="80" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="745" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0c5460">步骤 4</text>
    <text x="745" y="162" text-anchor="middle" font-size="14" fill="#0c5460">导入</text>
    <text x="745" y="180" text-anchor="middle" font-size="14" fill="#0c5460">Logitech G HUB</text>
  </g>
  <text x="745" y="215" text-anchor="middle" font-size="11" fill="#6c757d">粘贴脚本 + 绑定按键</text>

  <!-- 步骤 5 -->
  <g filter="url(#shadow)">
    <rect x="870" y="110" width="170" height="80" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="955" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#856404">步骤 5</text>
    <text x="955" y="162" text-anchor="middle" font-size="14" fill="#856404">编辑器</text>
    <text x="955" y="180" text-anchor="middle" font-size="14" fill="#856404">调整系数</text>
  </g>
  <text x="955" y="215" text-anchor="middle" font-size="11" fill="#6c757d">⚠️ 必须自调，不能直接用</text>

  <!-- 步骤 6 -->
  <g filter="url(#shadow)">
    <rect x="1080" y="110" width="170" height="80" rx="10" ry="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="1165" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#155724">步骤 6</text>
    <text x="1165" y="162" text-anchor="middle" font-size="14" fill="#155724">游戏内</text>
    <text x="1165" y="180" text-anchor="middle" font-size="14" fill="#155724">调试</text>
  </g>
  <text x="1165" y="215" text-anchor="middle" font-size="11" fill="#6c757d">对墙射击 + 调参</text>

  <!-- 箭头连接：延长线段，确保箭头清晰可见 -->
  <line x1="200" y1="150" x2="235" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="150" x2="445" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="150" x2="655" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="150" x2="865" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="150" x2="1075" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 底部图例 -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
    <text x="20" y="11" font-size="11" fill="#495057">起始/结束</text>
    <rect x="110" y="0" width="14" height="14" rx="2" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1.5"/>
    <text x="130" y="11" font-size="11" fill="#495057">过程步骤</text>
    <rect x="220" y="0" width="14" height="14" rx="2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
    <text x="240" y="11" font-size="11" fill="#495057">关键步骤（必须自调）</text>
  </g>
</svg>
