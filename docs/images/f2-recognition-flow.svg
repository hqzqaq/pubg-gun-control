<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 L 2 5 z" fill="#495057"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d8ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7ab8e8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8e6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8fd4b4;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe08a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffc94a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="320" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="640" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#212529">F2 自动识别数据流（日常切枪核心操作）</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#6c757d">切枪后按 Tab → F2，无需记忆组合键</text>

  <!-- 泳道分隔线 -->
  <line x1="40" y1="90" x2="1240" y2="90" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="40" y1="230" x2="1240" y2="230" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 泳道标签 -->
  <text x="50" y="84" font-size="11" font-weight="600" fill="#6c757d">用户操作</text>
  <text x="50" y="224" font-size="11" font-weight="600" fill="#6c757d">系统处理</text>

  <!-- 节点 1: 游戏内按 Tab（用户） -->
  <g filter="url(#shadow2)">
    <rect x="60" y="110" width="170" height="80" rx="10" ry="10" fill="url(#userGrad)" stroke="#2980b9" stroke-width="2"/>
    <text x="145" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">① 游戏内按 Tab</text>
    <text x="145" y="160" text-anchor="middle" font-size="12" fill="#ffffff">打开背包/武器栏</text>
    <text x="145" y="178" text-anchor="middle" font-size="12" fill="#ffffff">角色与枪械显示</text>
  </g>

  <!-- 节点 2: 按 F2（用户） -->
  <g filter="url(#shadow2)">
    <rect x="265" y="110" width="170" height="80" rx="10" ry="10" fill="url(#userGrad)" stroke="#2980b9" stroke-width="2"/>
    <text x="350" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">② 按 F2</text>
    <text x="350" y="160" text-anchor="middle" font-size="12" fill="#ffffff">触发截图识别</text>
    <text x="350" y="178" text-anchor="middle" font-size="12" fill="#ffffff">（可在设置中改键）</text>
  </g>

  <!-- 箭头 1→2 -->
  <line x1="230" y1="150" x2="260" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 跨泳道箭头 2→3 -->
  <path d="M 350 195 L 350 245" stroke="#495057" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- 节点 3: 自动识别（系统） -->
  <g filter="url(#shadow2)">
    <rect x="260" y="250" width="180" height="60" rx="10" ry="10" fill="url(#procGrad)" stroke="#27ae60" stroke-width="2"/>
    <text x="350" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">③ 自动识别</text>
    <text x="350" y="298" text-anchor="middle" font-size="11" fill="#ffffff">枪械 + 枪口 + 握把 + 枪托 + 倍镜</text>
  </g>

  <!-- 箭头 3→4 -->
  <line x1="440" y1="280" x2="545" y2="280" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 节点 4: 写入 dofile 文件（系统） -->
  <g filter="url(#shadow2)">
    <rect x="550" y="250" width="180" height="60" rx="10" ry="10" fill="url(#procGrad)" stroke="#27ae60" stroke-width="2"/>
    <text x="640" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">④ 写入 dofile 文件</text>
    <text x="640" y="298" text-anchor="middle" font-size="11" fill="#ffffff">auto_recognize_rec.lua</text>
  </g>

  <!-- 跨泳道箭头 4→5 -->
  <path d="M 730 250 L 730 195" stroke="#495057" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- 节点 5: GHUB 脚本读取（用户侧/GHUB） -->
  <g filter="url(#shadow2)">
    <rect x="645" y="110" width="170" height="80" rx="10" ry="10" fill="url(#outGrad)" stroke="#e67e22" stroke-width="2"/>
    <text x="730" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">⑤ GHUB 脚本读取</text>
    <text x="730" y="160" text-anchor="middle" font-size="12" fill="#ffffff">loadstring 加载</text>
    <text x="730" y="178" text-anchor="middle" font-size="12" fill="#ffffff">绕过 dofile 缓存</text>
  </g>

  <!-- 箭头 5→6 -->
  <line x1="815" y1="150" x2="920" y2="150" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 节点 6: 自动切换压枪参数（结果） -->
  <g filter="url(#shadow2)">
    <rect x="925" y="110" width="180" height="80" rx="10" ry="10" fill="url(#outGrad)" stroke="#e67e22" stroke-width="2"/>
    <text x="1015" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">⑥ 切换压枪参数</text>
    <text x="1015" y="160" text-anchor="middle" font-size="12" fill="#ffffff">对应枪械系数生效</text>
    <text x="1015" y="178" text-anchor="middle" font-size="12" fill="#ffffff">立即可用</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#userGrad)" stroke="#2980b9" stroke-width="1.5"/>
    <text x="18" y="10" font-size="11" fill="#495057">用户操作</text>
    <rect x="100" y="0" width="12" height="12" rx="2" fill="url(#procGrad)" stroke="#27ae60" stroke-width="1.5"/>
    <text x="118" y="10" font-size="11" fill="#495057">系统自动处理</text>
    <rect x="220" y="0" width="12" height="12" rx="2" fill="url(#outGrad)" stroke="#e67e22" stroke-width="1.5"/>
    <text x="238" y="10" font-size="11" fill="#495057">GHUB/结果</text>
  </g>
</svg>
