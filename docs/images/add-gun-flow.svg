<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#212529">新增枪械与弹道流程</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6c757d">当默认枪械列表不够用时</text>

  <!-- 节点 1: 设置中添加枪械 -->
  <g filter="url(#shadow3)">
    <rect x="350" y="85" width="200" height="60" rx="10" ry="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="450" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#155724">① 设置中添加枪械</text>
    <text x="450" y="130" text-anchor="middle" font-size="11" fill="#155724">写入基础脚本 canUse 表</text>
  </g>
  <line x1="450" y1="145" x2="450" y2="170" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- 节点 2: 采集该枪模板 -->
  <g filter="url(#shadow3)">
    <rect x="350" y="175" width="200" height="60" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="450" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#0c5460">② 采集该枪模板</text>
    <text x="450" y="220" text-anchor="middle" font-size="11" fill="#0c5460">托盘菜单 → 重新采集模板</text>
  </g>
  <line x1="450" y1="235" x2="450" y2="260" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- 节点 3: 添加弹道函数 -->
  <g filter="url(#shadow3)">
    <rect x="350" y="265" width="200" height="60" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="450" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#0c5460">③ 添加弹道函数</text>
    <text x="450" y="310" text-anchor="middle" font-size="11" fill="#0c5460">pubg["枪名"]() 骨架</text>
  </g>
  <line x1="450" y1="325" x2="450" y2="350" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- 决策菱形：使用弹道分析？ -->
  <g filter="url(#shadow3)">
    <polygon points="450,355 560,410 450,465 340,410" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="450" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#856404">使用弹道分析？</text>
    <text x="450" y="425" text-anchor="middle" font-size="11" fill="#856404">（对墙射击截图）</text>
  </g>

  <!-- 左分支：是 → 弹道分析 -->
  <text x="290" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#28a745">是（推荐）</text>
  <line x1="340" y1="410" x2="280" y2="410" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="180" y1="410" x2="180" y2="470" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="80" y="475" width="200" height="60" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="180" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#0c5460">④a 弹道分析</text>
    <text x="180" y="520" text-anchor="middle" font-size="11" fill="#0c5460">自动识别弹孔 + 预览</text>
  </g>
  <line x1="180" y1="535" x2="180" y2="555" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="80" y="560" width="200" height="45" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="180" y="585" text-anchor="middle" font-size="13" fill="#0c5460">导入到编辑器</text>
  </g>

  <!-- 右分支：否 → 编辑器直接编辑 -->
  <text x="610" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#17a2b8">否（微调）</text>
  <line x1="560" y1="410" x2="620" y2="410" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="720" y1="410" x2="720" y2="470" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="620" y="475" width="200" height="60" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="720" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#0c5460">④b 编辑器直接编辑</text>
    <text x="720" y="520" text-anchor="middle" font-size="11" fill="#0c5460">手动调整逐发偏移</text>
  </g>
  <line x1="720" y1="535" x2="720" y2="555" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="620" y="560" width="200" height="45" rx="10" ry="10" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="720" y="585" text-anchor="middle" font-size="13" fill="#0c5460">保存系数</text>
  </g>

  <!-- 两支合并到保存（不画线，因为两个分支都各自保存了，用文字说明） -->
  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#6c757d">两路径最终都会同步到基础脚本 + pubg_config.lua</text>
</svg>
